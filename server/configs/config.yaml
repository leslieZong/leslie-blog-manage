server:
  name: leslie-blog-server
  host: 0.0.0.0
  port: 8081
  mode: debug

# MySQL 数据库配置
mysql:
  # MySQL 服务地址
  host: 127.0.0.1

  # MySQL 服务端口
  port: 3306

  # 数据库名称
  database: leslie_blog

  # 数据库用户名
  username: root

  # 数据库密码
  #
  # 本地开发阶段可以暂时这样写。
  # 正式环境不要把真实密码提交到 Git。
  password: "123456"

  # 数据库字符集
  charset: utf8mb4

  # 最大打开连接数
  #
  # 表示程序最多同时建立多少个数据库连接。
  max_open_conns: 20

  # 最大空闲连接数
  #
  # 表示连接池最多保留多少个暂时没有使用的连接。
  max_idle_conns: 10

  # 单个数据库连接最大存活时间
  conn_max_lifetime: "1h"


jwt:
  secret: "please-change-this-secret"
  issuer: "leslie-blog"
  expire_hours: 24